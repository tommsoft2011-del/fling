[package]
name = "fling-desktop"
version = "0.6.34"
description = "Fling — fling text and files between your devices"
authors = ["tommsoft2011-del"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
aes-gcm = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
base64 = "0.22"
# v0.3: nearby discovery, clipboard images, device identity
mdns-sd = "0.13"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
hostname = "0.4"
rand = "0.9"
open = "5"
sha2 = "0.10"
livekit = { version = "0.9.5", features = ["rustls-tls-native-roots"] }
pbkdf2 = "0.12"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time", "macros"], default-features = false }
socket2 = "0.6"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
