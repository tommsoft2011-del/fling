# Build Fling CLI binaries on each platform's native runner and publish a
# GitHub Release. Building natively per platform means `bun install` fetches
# the correct @livekit/rtc-node native binding automatically — no hacks.
#
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.

name: release

on:
  push:
    branches: ['test/windows-desktop-*']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    # Test branches build only the desktop Windows app, never CLI packages.
    if: ${{ !startsWith(github.ref, 'refs/heads/test/pairing-confirm-observability-') && !startsWith(github.ref, 'refs/heads/test/windows-desktop-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            out: fling-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            out: fling-linux-arm64
          - os: windows-latest
            target: bun-windows-x64
            out: fling-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install

      - name: Compile ${{ matrix.out }}
        working-directory: packages/cli
        shell: bash
        run: |
          mkdir -p ../../dist
          bun build --compile --target=${{ matrix.target }} --outfile ../../dist/${{ matrix.out }} src/main.ts

      - name: Smoke test
        run: ./dist/${{ matrix.out }} --version
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON((startsWith(github.ref, 'refs/heads/test/pairing-confirm-observability-') || startsWith(github.ref, 'refs/heads/test/windows-desktop-')) && '{"include":[{"os":"windows-latest"}]}' || '{"include":[{"os":"ubuntu-latest"},{"os":"windows-latest"}]}') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          if ! apt-cache policy clang-21 | grep -Eq 'Candidate: [0-9]'; then
            . /etc/os-release
            key_file="$(mktemp)"
            trap 'rm -f "$key_file"' EXIT
            curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$key_file"
            fingerprint="$(gpg --show-keys --with-colons "$key_file" | awk -F: '$1 == "fpr" && !seen++ { print $10 }')"
            test "$fingerprint" = '6084F3CF814B57C1CF12EFD515CF4D18AF4F7421'
            sudo install -d -m 0755 /etc/apt/keyrings
            sudo gpg --dearmor --yes -o /etc/apt/keyrings/apt-llvm.gpg "$key_file"
            sudo chmod 0644 /etc/apt/keyrings/apt-llvm.gpg
            printf 'deb [arch=%s signed-by=/etc/apt/keyrings/apt-llvm.gpg] https://apt.llvm.org/%s/ llvm-toolchain-%s-21 main\n' \
              "$(dpkg --print-architecture)" "$VERSION_CODENAME" "$VERSION_CODENAME" \
              | sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
            sudo apt-get update
          fi
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf clang-21
          clang-21 --version
          clang++-21 --version
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        working-directory: apps/desktop
        run: bun run build

      - name: Test native diagnostic and privacy contracts (isolated diagnostic branch)
        if: startsWith(github.ref, 'refs/heads/test/pairing-confirm-observability-')
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Test frontend diagnostic contracts (isolated diagnostic branch)
        if: startsWith(github.ref, 'refs/heads/test/pairing-confirm-observability-')
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          bun test/lan-ipc-contract.ts
          bun test/lan-picker-ui.ts
          bun test/lan-confirm-observability.ts
          bun test/pairing-ui-observability.ts
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: ${{ startsWith(github.ref, 'refs/heads/test/pairing-confirm-observability-') && '--no-bundle' || '' }}

      - name: Prepare portable exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls apps/desktop/src-tauri/target/release/*.exe
          cp apps/desktop/src-tauri/target/release/fling-desktop.exe \
             "apps/desktop/src-tauri/target/release/Fling-portable-x64.exe"

      - name: Checksum diagnostic-only EXE
        if: startsWith(github.ref, 'refs/heads/test/pairing-confirm-observability-')
        shell: bash
        run: |
          cd apps/desktop/src-tauri/target/release
          sha256sum Fling-portable-x64.exe > Fling-portable-x64.exe.sha256
          printf 'diagnostic-only, not a fix\ncommit=%s\n' "$GITHUB_SHA" > diagnostic-build.txt

      - name: Checksum Windows test EXE
        if: startsWith(github.ref, 'refs/heads/test/windows-desktop-')
        shell: bash
        run: |
          cd apps/desktop/src-tauri/target/release
          sha256sum Fling-portable-x64.exe > Fling-portable-x64.exe.sha256
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: fling-desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/Fling-portable-x64.exe
            apps/desktop/src-tauri/target/release/Fling-portable-x64.exe.sha256
            apps/desktop/src-tauri/target/release/diagnostic-build.txt
          if-no-files-found: error

  release:
    needs: [build, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten and checksum
        run: |
          cd dist
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
