# Build Fling CLI binaries on each platform's native runner and publish a
# GitHub Release. Building natively per platform means `bun install` fetches
# the correct @livekit/rtc-node native binding automatically — no hacks.
#
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            out: fling-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            out: fling-linux-arm64
          - os: windows-latest
            target: bun-windows-x64
            out: fling-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install

      - name: Compile ${{ matrix.out }}
        working-directory: packages/cli
        run: bun build --compile --target=${{ matrix.target }} --outfile ../../dist/${{ matrix.out }} src/main.ts

      - name: Smoke test
        run: ./dist/${{ matrix.out }} --version
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
