name: verify-direct-diagnostic-artifact
on:
  push:
    branches: ['test/direct-artifact-verification']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify build provenance
        uses: actions/github-script@v7
        with:
          script: |
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: 40432480584});
            if (run.head_sha !== '238c6a5c41232a360d73a06e095b667b68cc09e3' || run.conclusion !== 'success') throw new Error('Unexpected build provenance');
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12704305559'
          run-id: 40432480584
          github-token: ${{ github.token }}
          path: payload
      - name: Verify x64 PE and SHA-256
        shell: bash
        run: |
          node <<'JS'
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          function files(p) {return fs.readdirSync(p,{withFileTypes:true}).flatMap(e=>e.isDirectory()?files(path.join(p,e.name)):[path.join(p,e.name)]);}
          const all=files('payload');
          const exes=all.filter(p=>path.basename(p)==='Fling-portable-x64.exe');
          if(exes.length!==1) throw new Error('Expected exactly one portable EXE');
          const exe=exes[0], data=fs.readFileSync(exe), pe=data.readUInt32LE(0x3c);
          if(data.readUInt16LE(0)!==0x5a4d || data.readUInt32LE(pe)!==0x4550 || data.readUInt16LE(pe+4)!==0x8664 || data.readUInt16LE(pe+24)!==0x20b) throw new Error('Not an x64 PE32+ executable');
          const digest=crypto.createHash('sha256').update(data).digest('hex');
          const expected=fs.readFileSync(exe+'.sha256','utf8').trim().split(/\s+/)[0];
          if(digest!==expected) throw new Error('EXE SHA-256 mismatch');
          const result='source=238c6a5c41232a360d73a06e095b667b68cc09e3 artifact=12704305559 machine=AMD64 PE32+ sha256='+digest;
          console.log('::notice title=Verified Windows diagnostic EXE::'+result);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,result+'\n');
          JS
